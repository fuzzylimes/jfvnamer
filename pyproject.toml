[project]
name = "jfvnamer"
version = "0.1.0"
description = "A Jellyfin-focused video file renamer — renames and organizes TV show and movie files into Jellyfin's expected directory structure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
jfvnamer = "jfvnamer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jfvnamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
